name: Publish HERCHI26 Chief v0.10.2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0102.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified private build artifact
        env:
          ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-a0a4-81f4-8788-2dbb39769552/raw?se=2026-09-16T19%3A15%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=cb34b92b-74be-5174-a6af-13d5a1fc9c3f&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T18%3A11%3A20Z&ske=2026-09-17T18%3A11%3A20Z&sks=b&skv=2026-02-06&sig=TRFydYPPtwm0kDU9fESvOCdM32EjAA0tsELylGKf6%2B0%3D"
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/channel.zip
          rm -rf /tmp/channel && mkdir -p /tmp/channel
          unzip -q /tmp/channel.zip -d /tmp/channel
          test -f /tmp/channel/manifest.json
          test -f /tmp/channel/HERCHI26_CHIEF_RUNTIME_UPDATE.zip
      - name: Verify v0.10.2 manifest and package SHA-256
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path('/tmp/channel')
          m=json.loads((root/'manifest.json').read_text())
          assert m['version']=='0.10.2', m
          assert m['buildId']=='H26-CORE-009', m
          p=root/'HERCHI26_CHIEF_RUNTIME_UPDATE.zip'
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha==m['sha256'], (sha,m['sha256'])
          assert sha=='d64a6e32cd523e6a29612f8f0c91af96ac4149e46aa4abbacd56a501c8d01c98', sha
          print('PASS', m['version'], sha)
          PY
      - name: Publish channel files
        run: |
          cp /tmp/channel/manifest.json ./manifest.json
          cp /tmp/channel/HERCHI26_CHIEF_RUNTIME_UPDATE.zip ./HERCHI26_CHIEF_RUNTIME_UPDATE.zip
          git config user.name "HERCHI26 Update Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json HERCHI26_CHIEF_RUNTIME_UPDATE.zip
          git commit -m "Publish HERCHI26 Chief v0.10.2 master dashboard"
          git push origin main
