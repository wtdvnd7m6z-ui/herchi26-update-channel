name: Publish HERCHI26 Chief v0.10.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0100.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified private build artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestus2.oaiusercontent.com/files/00000000-e1e0-81f8-ab90-f7f631a7da29/raw?se=2026-09-16T18%3A02%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=c637b4c3-8d48-5065-82e1-06a203c727de&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T08%3A01%3A24Z&ske=2026-09-17T08%3A01%3A24Z&sks=b&skv=2026-02-06&sig=7PagS1ixje0vGvCJV8mD9aI/Qgnw8o6IIsMCtn8JcTk%3D"
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/channel.zip
          rm -rf /tmp/channel && mkdir -p /tmp/channel
          unzip -q /tmp/channel.zip -d /tmp/channel
          test -f /tmp/channel/manifest.json
          test -f /tmp/channel/HERCHI26_CHIEF_RUNTIME_UPDATE.zip
      - name: Verify v0.10.0 manifest and package SHA-256
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path('/tmp/channel')
          m=json.loads((root/'manifest.json').read_text())
          assert m['version']=='0.10.0', m
          assert m['buildId']=='H26-CORE-009', m
          p=root/'HERCHI26_CHIEF_RUNTIME_UPDATE.zip'
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha==m['sha256'], (sha,m['sha256'])
          print('PASS', m['version'], sha)
          PY
      - name: Publish channel files
        run: |
          cp /tmp/channel/manifest.json ./manifest.json
          cp /tmp/channel/HERCHI26_CHIEF_RUNTIME_UPDATE.zip ./HERCHI26_CHIEF_RUNTIME_UPDATE.zip
          git config user.name "HERCHI26 Update Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json HERCHI26_CHIEF_RUNTIME_UPDATE.zip
          git commit -m "Publish HERCHI26 Chief v0.10.0 Executive start"
          git push origin main
