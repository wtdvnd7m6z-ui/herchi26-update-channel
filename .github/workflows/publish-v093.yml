name: Publish HERCHI26 Chief v0.9.3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v093.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build verified v0.9.3 runtime package
        env:
          BASE_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-2084-81f5-b777-3f94bdc1444a/raw?se=2026-09-16T15%3A00%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=b47d9ace-f012-5b14-b7a1-350398af6e79&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T07%3A18%3A32Z&ske=2026-09-17T07%3A18%3A32Z&sks=b&skv=2026-02-06&sig=N8Ivkt/xSvfhd9T6Z7b2Q/atHC0plHPrRq1vZyfw6vs%3D"
          SERVE_B64: ""
          INDEX_B64: ""
          CSS_B64: ""
        run: |
          set -euo pipefail
          curl -fL "$BASE_URL" -o base-artifact.zip
          rm -rf base stage
          mkdir base stage
          unzip -q base-artifact.zip -d base
          unzip -q base/HERCHI26_CHIEF_RUNTIME_UPDATE.zip -d stage
          printf '%s' "$SERVE_B64" | base64 -d > stage/HERCHI26_CHIEF_RUNTIME/scripts/serve-chief-v1.mjs
          printf '%s' "$INDEX_B64" | base64 -d | sed 's/0\.9\.2/0.9.3/g' > stage/HERCHI26_CHIEF_RUNTIME/apps/chief-v1/dist/index.html
          printf '%s' "$CSS_B64" | base64 -d > stage/HERCHI26_CHIEF_RUNTIME/apps/chief-v1/dist/updater-ui.css
          cat > stage/HERCHI26_CHIEF_RUNTIME/apps/chief-v1/dist/version.json <<'JSON'
          {
            "product": "HERCHI26 Chief",
            "version": "0.9.3",
            "versionDate": "2026-09-16",
            "buildId": "H26-CORE-008",
            "channel": "BUILD",
            "display": "v0.9.3 · 16.09.2026"
          }
          JSON
          rm -f HERCHI26_CHIEF_RUNTIME_UPDATE.zip manifest.json
          (cd stage && zip -qry ../HERCHI26_CHIEF_RUNTIME_UPDATE.zip HERCHI26_CHIEF_RUNTIME)
          unzip -tq HERCHI26_CHIEF_RUNTIME_UPDATE.zip
          test "$(unzip -p HERCHI26_CHIEF_RUNTIME_UPDATE.zip HERCHI26_CHIEF_RUNTIME/apps/chief-v1/dist/version.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "0.9.3"
          SHA="$(sha256sum HERCHI26_CHIEF_RUNTIME_UPDATE.zip | awk '{print $1}')"
          cat > manifest.json <<JSON
          {
            "schemaVersion": 1,
            "product": "HERCHI26 Chief",
            "version": "0.9.3",
            "versionDate": "2026-09-16",
            "buildId": "H26-CORE-008",
            "channel": "BUILD",
            "packageUrl": "HERCHI26_CHIEF_RUNTIME_UPDATE.zip",
            "sha256": "$SHA",
            "notes": "HERCHI26 Chief public self-update channel test"
          }
          JSON
          echo "$SHA  HERCHI26_CHIEF_RUNTIME_UPDATE.zip" | sha256sum -c -
      - name: Publish manifest and package
        run: |
          set -euo pipefail
          git config user.name "HERCHI26 Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json HERCHI26_CHIEF_RUNTIME_UPDATE.zip
          git commit -m "Publish HERCHI26 Chief v0.9.3 update" || exit 0
          git push origin HEAD:main
