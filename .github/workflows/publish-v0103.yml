name: Publish HERCHI26 Chief v0.10.3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0103.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified private build artifact
        env:
          ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-1fac-81f4-bca6-1662ac9cf1d3/raw?se=2026-09-18T14%3A25%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=5673b8ca-a3c3-5ccd-b54c-c7b8d375c54b&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T13%3A40%3A31Z&ske=2026-09-19T13%3A40%3A31Z&sks=b&skv=2026-02-06&sig=5kKS5Pwc/uf90SPor6i8ZtsDl0A3SNGwfBaItShtRtM%3D"
        run: |
          set -e
          curl -fL "$ARTIFACT_URL" -o /tmp/channel.zip
          rm -rf /tmp/channel && mkdir -p /tmp/channel
          unzip -q /tmp/channel.zip -d /tmp/channel
          test -f /tmp/channel/manifest.json
          test -f /tmp/channel/HERCHI26_V1_MAC_APP_UPDATE.zip

      - name: Verify v0.10.3 manifest and package SHA-256
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path('/tmp/channel')
          m=json.loads((root/'manifest.json').read_text())
          assert m['version']=='0.10.3', m
          assert m['buildId']=='H26-CORE-010', m
          assert m['packageKind']=='MAC_APP', m
          assert m['commit']=='e903658072e8c2ae57dd20179d535f3b9eb4523f', m
          p=root/'HERCHI26_V1_MAC_APP_UPDATE.zip'
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha==m['sha256'], (sha,m['sha256'])
          assert sha=='27288a7ec858905716078ce28014c551973bb97b5d0bdcc8da09aba466ffc659', sha
          print('PASS', m['version'], sha)
          PY

      - name: Publish release asset and channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v0.10.3"
          ASSET="/tmp/channel/HERCHI26_V1_MAC_APP_UPDATE.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "HERCHI26 Chief v0.10.3" --notes "HERCHI26 Chief Mac app update v0.10.3"
          fi

          python3 - <<'PY'
          import json, pathlib
          src=pathlib.Path('/tmp/channel/manifest.json')
          m=json.loads(src.read_text())
          m['packageUrl']='https://github.com/wtdvnd7m6z-ui/herchi26-update-channel/releases/download/v0.10.3/HERCHI26_V1_MAC_APP_UPDATE.zip'
          pathlib.Path('manifest.json').write_text(json.dumps(m, indent=2)+'\n')
          PY

          git config user.name "HERCHI26 Update Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json
          git commit -m "Publish HERCHI26 Chief v0.10.3 Mac app update"
          git push origin main
