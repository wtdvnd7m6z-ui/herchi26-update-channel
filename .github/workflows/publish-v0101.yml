name: Publish HERCHI26 Chief v0.10.1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0101.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified private build artifact
        env:
          ARTIFACT_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-6644-81f5-a57d-d009bd421012/raw?se=2026-09-16T18%3A40%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=e4707882-ba89-5c83-a9b1-7dd2c40db092&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T06%3A09%3A28Z&ske=2026-09-17T06%3A09%3A28Z&sks=b&skv=2026-02-06&sig=twowVp0IzeAmcvTheUJC3OUmopQ4YOFYaP50Mnmhn78%3D"
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/channel.zip
          rm -rf /tmp/channel && mkdir -p /tmp/channel
          unzip -q /tmp/channel.zip -d /tmp/channel
          test -f /tmp/channel/manifest.json
          test -f /tmp/channel/HERCHI26_CHIEF_RUNTIME_UPDATE.zip
      - name: Verify v0.10.1 manifest and package SHA-256
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path('/tmp/channel')
          m=json.loads((root/'manifest.json').read_text())
          assert m['version']=='0.10.1', m
          assert m['buildId']=='H26-CORE-009', m
          p=root/'HERCHI26_CHIEF_RUNTIME_UPDATE.zip'
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha==m['sha256'], (sha,m['sha256'])
          assert sha=='45ef620737b19ad2104f06b8ec5f8435fe7b352bff0ed6544e310ea4e3ab1f7f', sha
          print('PASS', m['version'], sha)
          PY
      - name: Publish channel files
        run: |
          cp /tmp/channel/manifest.json ./manifest.json
          cp /tmp/channel/HERCHI26_CHIEF_RUNTIME_UPDATE.zip ./HERCHI26_CHIEF_RUNTIME_UPDATE.zip
          git config user.name "HERCHI26 Update Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json HERCHI26_CHIEF_RUNTIME_UPDATE.zip
          git commit -m "Publish HERCHI26 Chief v0.10.1 live resources"
          git push origin main
